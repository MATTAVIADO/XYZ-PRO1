<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>GUSTAVO ANALITC'S — Análise Cripto + Voz</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{
  --bg:#0b0c10; --panel:#0f1316; --accent:#66fcf1; --good:#00ff99; --bad:#ff4c4c; --muted:#9aa;
}
body{background:radial-gradient(circle at top,#0b0c10,#000);color:#fff;font-family:Inter,Arial,Helvetica,sans-serif;margin:0;padding:12px;}
.header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{color:var(--accent);margin:0 0 8px 0; font-size:18px;}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,select,input{padding:10px;border-radius:8px;border:0;font-size:16px}
button{background:#111;color:var(--accent);cursor:pointer; min-height:44px;}
button.primary{background:var(--accent);color:#021214}
.tabbar{display:flex;gap:8px;margin:12px 0; flex-wrap: wrap;}
.tab{padding:12px 16px;border-radius:8px;cursor:pointer;background:#111;color:var(--accent); min-height:44px;}
.tab.active{background:var(--accent);color:#021214}
.panel{background:var(--panel);padding:12px;border-radius:10px;box-shadow:0 6px 22px rgba(0,0,0,0.5);margin-top:12px}
.table{width:100%;border-collapse:collapse;margin-top:12px; font-size:14px;}
th,td{padding:8px;border-bottom:1px solid #0b0f11;text-align:center}
th{color:var(--accent);text-transform:uppercase;font-size:12px}
.up{color:var(--good);font-weight:700}
.down{color:var(--bad);font-weight:700}
.neutral{color:var(--muted);font-weight:700}
.small{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:768px){ .grid{grid-template-columns:1fr 420px} }
.canvasWrap{background:#0d1012;padding:8px;border-radius:8px}
.inputSmall{width:100%;background:#0d1012;color:#fff; min-height:44px; margin-bottom: 8px;}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.legend{display:flex;gap:8px;justify-content:center;margin-top:8px}
.legend span{font-size:13px}
.listBox{background:#0b0f11;padding:8px;border-radius:6px;max-height:160px;overflow:auto}
.alertBox{margin-top:10px;padding:10px;border-radius:8px}
.alertGood{background:rgba(0,255,153,0.06);color:var(--good)}
.alertBad{background:rgba(255,76,76,0.06);color:var(--bad)}

/* mic button */
#voiceAssistantBtn {
  position: fixed; bottom: 20px; right: 20px;
  width: 70px; height: 70px; padding: 10px;
  background: linear-gradient(135deg, #3b82f6, #1e40af);
  color: white; border: none; border-radius: 50%;
  font-size: 28px; cursor: pointer; z-index: 999999;
  display:flex; align-items:center; justify-content:center;
  box-shadow: 0 6px 20px rgba(0,0,0,0.4);
}

/* toast */
#voiceToast {
  position: fixed; bottom: 100px; right: 20px;
  background: rgba(15,19,22,0.95); color: #66fcf1;
  padding: 10px 14px; border-radius: 8px; font-size: 13px;
  border: 1px solid rgba(102,252,241,0.12); z-index: 999998;
  display: none;
}

/* voice indicator center */
#voiceIndicator {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.85);
  background: rgba(102, 252, 241, 0.95); color: #021214; padding: 30px 36px;
  border-radius: 50%; font-size: 40px; z-index: 999997; animation: pulse 1s infinite;
  box-shadow: 0 0 30px rgba(102, 252, 241, 0.5);
  display:none;
}
@keyframes pulse {
  0% { transform: translate(-50%, -50%) scale(1); }
  50% { transform: translate(-50%, -50%) scale(1.08); }
  100% { transform: translate(-50%, -50%) scale(1); }
}

@media (max-width: 768px) {
  body { padding: 8px; }
  h1 { font-size: 16px; }
  .header { flex-direction: column; align-items: stretch; }
}
</style>
</head>

<body>
  <div class="header">
    <div>
      <h1>📈 GUSTAVO ANALITC'S — Top Criptos + Voz</h1>
      <div class="small" id="voiceHint">Sistema de voz pronto — tentando ativar automaticamente.</div>
    </div>
    <div class="controls">
      <div class="tabbar">
        <div class="tab active" id="tabMain">Top Criptos</div>
        <div class="tab" id="tabBook">Análise Profunda</div>
      </div>
    </div>
  </div>

  <div id="mainPanel" class="panel">
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <select id="periodSelect" class="inputSmall">
          <option value="24h">24h</option>
          <option value="12h">12h</option>
          <option value="1h">1h</option>
        </select>

        <select id="refreshSelect" class="inputSmall">
          <option value="30000">30s</option>
          <option value="60000">1m</option>
          <option value="120000">2m</option>
        </select>

        <button id="openBookBtn" class="primary">📊 Análise Interna</button>
      </div>

      <div class="small" id="mainStatus">Última atualização: —</div>
    </div>

    <table class="table">
      <thead>
        <tr>
          <th>Par</th>
          <th>Preço</th>
          <th>Var%</th>
          <th>Sinal</th>
        </tr>
      </thead>
      <tbody id="mainTableBody"></tbody>
    </table>
  </div>

  <div id="bookPanel" class="panel" style="display:none">
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap; width:100%;">
        <input id="pairInput" class="inputSmall" value="BTCUSDT" placeholder="Digite o par..." />
        <select id="kInterval" class="inputSmall">
          <option value="1m">1m</option><option value="5m">5m</option>
          <option value="1h" selected>1h</option><option value="4h">4h</option>
        </select>
        <button id="analyzeNowBtn" style="flex:1;">Analisar Agora</button>
        <button id="autoBtn" class="tab" style="flex:1;">Auto OFF</button>
      </div>
    </div>

    <div class="grid" style="margin-top:12px">
      <div>
        <table style="width:100%">
          <tbody>
            <tr><th>Par</th><td id="infoPair">—</td></tr>
            <tr><th>Preço</th><td id="infoPrice">—</td></tr>
            <tr><th>Pressão Compra</th><td id="pressBuy">$—</td></tr>
            <tr><th>Pressão Venda</th><td id="pressSell">$—</td></tr>
            <tr><th>Recomendação</th><td id="recommend">—</td></tr>
          </tbody>
        </table>
      </div>
    </div>
    <div id="status" class="small" style="margin-top:8px">Pronto.</div>
  </div>

  <!-- mic button only -->
  <button id="voiceAssistantBtn" title="Toque para ativar/pausar a escuta">🎤</button>

  <!-- small toast -->
  <div id="voiceToast"></div>

  <!-- voice center indicator -->
  <div id="voiceIndicator">🎤</div>

<script>
// ===================== CONFIGURAÇÕES =====================
const monitoredSymbols = ["BTCUSDT","ETHUSDT","SOLUSDT","XRPUSDT","ADAUSDT","DOGEUSDT","BNBUSDT","MATICUSDT","AVAXUSDT","DOTUSDT","LINKUSDT","ARBUSDT"];
let rec = null;
let recognitionSupported = false;
let isListening = false;
let autoListen = true; // tenta iniciar automaticamente na carga
let refreshTimer = null;

// ===================== UTILs VISUAIS =====================
function showToast(text, timeout=3000){
    const t = document.getElementById('voiceToast');
    t.innerText = text;
    t.style.display = 'block';
    setTimeout(()=> { t.style.display = 'none'; }, timeout);
}
function showVoiceIndicator(show){
    const el = document.getElementById('voiceIndicator');
    el.style.display = show ? 'block' : 'none';
}
function updateVoiceHint(txt){
    const h = document.getElementById('voiceHint');
    if(h) h.innerText = txt;
}

// ===================== SPEECH RECOGNITION =====================
function initializeSpeechRecognition() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        recognitionSupported = false;
        updateVoiceHint("Reconhecimento de voz não suportado neste navegador.");
        return;
    }
    try {
        rec = new SpeechRecognition();
        rec.lang = "pt-BR";
        rec.continuous = false; // one-shot per start
        rec.interimResults = false;
        recognitionSupported = true;

        rec.onstart = function() {
            isListening = true;
            updateVoiceStatus("Ouvindo...");
            showVoiceIndicator(true);
            showToast("Ouvindo... fale agora", 2000);
        };

        rec.onresult = function(event) {
            const pergunta = event.results[0][0].transcript;
            console.log("Detectado:", pergunta);
            updateVoiceStatus("Processando...");
            showVoiceIndicator(false);
            isListening = false;
            processarComando(pergunta);
        };

        rec.onerror = function(event) {
            console.error("Erro no reconhecimento:", event);
            isListening = false;
            showVoiceIndicator(false);
            if (event.error === 'not-allowed' || event.error === 'permission-denied') {
                updateVoiceStatus("Microfone bloqueado");
                showToast("Permissão do microfone negada. Toque no cadeado na barra e permita.", 6000);
                showPermissionGuide();
            } else if(event.error === 'no-speech') {
                updateVoiceStatus("Nenhuma fala detectada");
                showToast("Não ouvi nada. Tentando novamente em 1s...",1500);
                // tentar novamente automaticamente
                setTimeout(()=> tryStartRecognition(true), 1000);
            } else {
                updateVoiceStatus("Erro: " + event.error);
            }
        };

        rec.onend = function() {
            isListening = false;
            showVoiceIndicator(false);
            updateVoiceStatus("Clique para falar");
            // se autoListen estiver ativo, re-ligar automaticamente (cuidado com loops)
            if (autoListen) {
                // delay curto para evitar loop imediato
                setTimeout(()=> tryStartRecognition(false), 700);
            }
        };

    } catch (e) {
        console.error("Falha init recognition:", e);
        recognitionSupported = false;
    }
}

function updateVoiceStatus(message){
    const btn = document.getElementById('voiceAssistantBtn');
    if (!btn) return;
    btn.title = message;
}

async function tryStartRecognition(userGestureRequired=false){
    if (!recognitionSupported) return;
    if (isListening) return;
    try {
        // Alguns navegadores exigem getUserMedia para liberar reconhecimento
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            // se já temos permissão, start direto; caso contrário, solicitar
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                stream.getTracks().forEach(t=>t.stop());
                // com permissão, iniciar rec
                rec.start();
            } catch (permErr) {
                // permissão negada ou user gesture required
                if (!userGestureRequired) {
                    // tentar iniciar rec sem pedir explicitamente (pode falhar)
                    try { rec.start(); } catch(e){ showPermissionGuide(); }
                } else {
                    showPermissionGuide();
                }
            }
        } else {
            // fallback: tentar rec.start, pode falhar
            try { rec.start(); } catch(e){ console.warn("Start failed", e); }
        }
    } catch (e) {
        console.error("Erro ao iniciar reconhecimento:", e);
        showPermissionGuide();
    }
}

function startStopManual(){
    if (!recognitionSupported) {
        showToast("Voz não suportada aqui.");
        return;
    }
    if (isListening) {
        try { rec.stop(); } catch(e){}
    } else {
        tryStartRecognition(true);
    }
}

// ===================== PERMISSION GUIDE =====================
function showPermissionGuide() {
    const existing = document.getElementById('permissionGuide');
    if (existing) return;
    const guideHTML = document.createElement('div');
    guideHTML.id = 'permissionGuide';
    guideHTML.style.cssText = `
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        background: rgba(15,19,22,0.98); padding: 18px; border-radius: 10px;
        border: 2px solid #66fcf1; z-index: 1000000; width:90%; max-width:420px;
        color: white; text-align:left;
    `;
    guideHTML.innerHTML = `
        <h3 style="color:#66fcf1;margin:0 0 8px 0">🔒 Permissão de Microfone</h3>
        <p style="margin:0 0 8px 0">Para usar o assistente de voz faça isso:</p>
        <ol style="margin:0 0 12px 18px; color:#cfe;">
            <li>Toque no cadeado (🔒) na barra de endereços do navegador</li>
            <li>Encontre "Microfone" nas permissões</li>
            <li>Defina como <strong>Permitir</strong></li>
            <li>Recarregue a página</li>
        </ol>
        <div style="text-align:right"><button id="closePermBtn" style="background:#66fcf1;color:#021214;border:none;padding:8px 12px;border-radius:6px;cursor:pointer">Entendi</button></div>
    `;
    document.body.appendChild(guideHTML);
    document.getElementById('closePermBtn').addEventListener('click', ()=> guideHTML.remove());
}

// ===================== COMANDOS E ANÁLISES =====================

async function processarComando(pergunta) {
    pergunta = pergunta.toLowerCase();
    console.log("Processando comando:", pergunta);

    // comandos diretos
    if (pergunta.includes("analisar") || pergunta.includes("book")) {
        analyzeBookNow();
        falarResposta("Senhor Gustavo, iniciando análise do book.");
        return;
    }

    if (pergunta.includes("melhor venda") || pergunta.includes("onde vender") || pergunta.includes("short")) {
        const r = await calcularMelhorShort();
        falarResposta("Senhor Gustavo, " + r);
        return;
    }

    if (pergunta.includes("melhor compra") || pergunta.includes("onde comprar") || pergunta.includes("long")) {
        const r = await calcularMelhorCompra();
        falarResposta("Senhor Gustavo, " + r);
        return;
    }

    if (pergunta.includes("atualizar") || pergunta.includes("refresh") || pergunta.includes("atualiza")) {
        await updateMainTable();
        falarResposta("Atualizando dados de mercado.");
        return;
    }

    if (pergunta.includes("oi") || pergunta.includes("olá") || pergunta.includes("alô")) {
        falarResposta("Olá Senhor Gustavo! Comandos disponíveis: melhor compra, melhor venda, analisar book, atualizar dados, ou pergunte por uma moeda como Bitcoin ou Solana.");
        return;
    }

    if (pergunta.includes("ajuda") || pergunta.includes("comandos")) {
        falarResposta("Senhor Gustavo, posso analisar o book, indicar melhor compra ou venda, ou analisar moedas específicas. Diga, por exemplo, 'como está o bitcoin' ou 'melhor compra'.");
        return;
    }

    // detectar moedas
    const moedas = ["bitcoin","btc","ethereum","eth","solana","sol","xrp","ada","doge","bnb","matic","avalanche","avax","dot","link","arb","arbis"];
    let moedaDetectada = null;
    for (let m of moedas) {
        if (pergunta.includes(m)) { moedaDetectada = m; break; }
    }
    if (moedaDetectada) {
        analisarMoedaEspecifica(moedaDetectada);
        return;
    }

    // padrão
    falarResposta("Senhor Gustavo, comando não reconhecido. Diga 'ajuda' para ver comandos.");
}

// fala + notificação visual
function falarResposta(txt){
    // fala
    if (window.speechSynthesis) {
        try {
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(txt);
            utter.lang = "pt-BR";
            utter.rate = 1.0;
            utter.pitch = 1.0;
            window.speechSynthesis.speak(utter);
        } catch(e){ console.warn("Erro síntese:", e); }
    }
    // toast
    showToast(txt, 4500);
}

// analisa moeda específica (usa Binance)
async function analisarMoedaEspecifica(nome) {
    const map = {
        "btc":"BTCUSDT","bitcoin":"BTCUSDT",
        "eth":"ETHUSDT","ethereum":"ETHUSDT",
        "sol":"SOLUSDT","solana":"SOLUSDT",
        "xrp":"XRPUSDT",
        "ada":"ADAUSDT",
        "doge":"DOGEUSDT",
        "bnb":"BNBUSDT",
        "matic":"MATICUSDT",
        "avax":"AVAXUSDT","avalanche":"AVAXUSDT",
        "dot":"DOTUSDT",
        "link":"LINKUSDT",
        "arb":"ARBUSDT","arbis":"ARBUSDT"
    };
    const par = map[nome];
    if (!par) { falarResposta("Senhor Gustavo, ainda não tenho dados para essa moeda."); return; }

    falarResposta("Senhor Gustavo, analisando " + nome.toUpperCase() + "...");
    try {
        const url = `https://api.binance.com/api/v3/ticker/24hr?symbol=${par}`;
        const r = await fetch(url);
        const d = await r.json();
        if (!d || !d.lastPrice) { falarResposta("Senhor Gustavo, falha ao obter dados de " + par); return; }

        const preco = Number(d.lastPrice).toFixed(4);
        const variacao = Number(d.priceChangePercent).toFixed(2);
        let sinal = "neutro";
        if (variacao > 2) sinal = "tendência forte de alta";
        else if (variacao > 0.5) sinal = "tendência de alta";
        else if (variacao < -2) sinal = "tendência de forte queda";
        else if (variacao < -0.5) sinal = "tendência de queda";

        const texto = `Senhor Gustavo, ${par}: preço $${preco}, var ${variacao}%. Interpretação: ${sinal}.`;
        falarResposta(texto);
    } catch (e) {
        console.error(e);
        falarResposta("Senhor Gustavo, erro ao analisar " + nome);
    }
}

// ===================== FUNÇÕES DE DADOS (Tabela principal) =====================

async function updateMainTable() {
    const body = document.getElementById('mainTableBody');
    body.innerHTML = '';
    document.getElementById('mainStatus').innerText = 'Atualizando...';

    try {
        // buscar todos os símbolos monitorados em paralelo
        const promises = monitoredSymbols.map(s => fetch(`https://api.binance.com/api/v3/ticker/24hr?symbol=${s}`).then(r => r.json()));
        const results = await Promise.all(promises);

        // popular tabela
        results.forEach(item => {
            const tr = document.createElement('tr');
            const price = item.lastPrice ? Number(item.lastPrice) : 0;
            const change = item.priceChangePercent ? Number(item.priceChangePercent) : 0;
            const sinalClass = change > 0 ? 'up' : change < 0 ? 'down' : 'neutral';
            tr.innerHTML = `
                <td>${item.symbol}</td>
                <td>${price.toFixed(price>1?2:4)}</td>
                <td class="${sinalClass}">${change.toFixed(2)}%</td>
                <td>${change > 1 ? 'Comprar' : change < -1 ? 'Vender' : 'Neutro'}</td>
            `;
            body.appendChild(tr);
        });

        document.getElementById('mainStatus').innerText = 'Última atualização: ' + new Date().toLocaleTimeString('pt-BR');
    } catch (e) {
        console.error("Erro updateMainTable:", e);
        document.getElementById('mainStatus').innerText = 'Erro ao atualizar';
    }
}

// melhor compra = maior var positiva; melhor venda = maior var negativa
async function calcularMelhorCompra() {
    try {
        const promises = monitoredSymbols.map(s => fetch(`https://api.binance.com/api/v3/ticker/24hr?symbol=${s}`).then(r => r.json()));
        const results = await Promise.all(promises);
        // filtrar válidos
        const sorted = results.filter(r => r && r.priceChangePercent !== undefined)
                              .sort((a,b) => Number(b.priceChangePercent) - Number(a.priceChangePercent));
        const top = sorted[0];
        if (!top) return "não encontrei oportunidades agora.";
        return `${top.symbol} com variação ${Number(top.priceChangePercent).toFixed(2)}%`;
    } catch (e) {
        console.error(e);
        return "erro ao calcular melhor compra.";
    }
}

async function calcularMelhorShort() {
    try {
        const promises = monitoredSymbols.map(s => fetch(`https://api.binance.com/api/v3/ticker/24hr?symbol=${s}`).then(r => r.json()));
        const results = await Promise.all(promises);
        const sorted = results.filter(r => r && r.priceChangePercent !== undefined)
                              .sort((a,b) => Number(a.priceChangePercent) - Number(b.priceChangePercent));
        const top = sorted[0];
        if (!top) return "não encontrei oportunidades agora.";
        return `${top.symbol} com variação ${Number(top.priceChangePercent).toFixed(2)}%`;
    } catch (e) {
        console.error(e);
        return "erro ao calcular melhor venda.";
    }
}

// ===================== BOOK PANEL (simples) =====================
function analyzeBookNow() {
    document.getElementById('status').innerText = 'Analisando...';
    // Simulação de análise rápida (substitua por lógica real se tiver)
    setTimeout(()=>{
        document.getElementById('status').innerText = 'Análise completa';
        showToast("Análise do book finalizada.", 2500);
    }, 1600);
}

// ===================== UI e Eventos =====================

function initializeVoiceButton() {
    const btn = document.getElementById('voiceAssistantBtn');
    btn.addEventListener('click', (e)=> {
        e.preventDefault();
        // toggle manual
        startStopManual();
    });

    // longo toque no mobile para pausar/reiniciar rápido (opcional)
    let pressTimer = null;
    btn.addEventListener('touchstart', ()=> { pressTimer = Date.now(); });
    btn.addEventListener('touchend', ()=> { pressTimer = null; });
}

function showTab(name){
    if(name === 'main'){
        document.getElementById('mainPanel').style.display='block';
        document.getElementById('bookPanel').style.display='none';
        document.getElementById('tabMain').classList.add('active');
        document.getElementById('tabBook').classList.remove('active');
    } else {
        document.getElementById('mainPanel').style.display='none';
        document.getElementById('bookPanel').style.display='block';
        document.getElementById('tabBook').classList.add('active');
        document.getElementById('tabMain').classList.remove('active');
    }
}

// eventos
document.getElementById('tabMain').addEventListener('click', ()=> showTab('main'));
document.getElementById('tabBook').addEventListener('click', ()=> showTab('book'));
document.getElementById('analyzeNowBtn').addEventListener('click', analyzeBookNow);
document.getElementById('openBookBtn').addEventListener('click', ()=> showTab('book'));

// ===================== INICIALIZAÇÃO =====================

document.addEventListener('DOMContentLoaded', async function(){
    initializeVoiceButton();
    initializeSpeechRecognition();

    // atualiza tabela inicialmente e depois periodicamente
    await updateMainTable();
    const refreshSelect = document.getElementById('refreshSelect');
    let interval = Number(refreshSelect.value) || 30000;
    refreshTimer = setInterval(updateMainTable, interval);
    refreshSelect.addEventListener('change', ()=>{
        clearInterval(refreshTimer);
        interval = Number(refreshSelect.value) || 30000;
        refreshTimer = setInterval(updateMainTable, interval);
    });

    // tentar ativar automaticamente (pode pedir permissão)
    setTimeout(()=> {
        tryStartRecognition(false);
    }, 800);

    updateVoiceHint("Toque no microfone para ativar/pausar a escuta. Se precisar, permita o microfone no navegador.");
});
</script>
</body>
</html>
